[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audioverdict"
version = "1.0.0"
description = "Zero-dependency, offline-first audio evidence engine: turn any audio file into evidence an AI agent can read."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AudioVerdict contributors" }]
keywords = [
    "audio", "forensics", "analysis", "ai-agent", "loudness", "mfcc",
    "fingerprint", "zero-dependency", "offline", "cli", "tamper-detection",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
audioverdict = "audioverdict.cli:main"
avd = "audioverdict.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/AudioVerdict"
Repository = "https://github.com/gitstq/AudioVerdict"
Issues = "https://github.com/gitstq/AudioVerdict/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
